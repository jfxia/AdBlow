<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="appTitle"></title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      /* options-only layout: content width and paragraph rhythm. Tokens come from ui.css */
      body {
        padding: 26px 22px 64px;
        background: var(--bg-soft);
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
      }
      header.brand {
        padding-bottom: 4px;
      }
      header.brand img {
        width: 30px;
        height: 30px;
      }
      header.brand b {
        font-size: 18px;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 14px 0 4px;
        color: var(--fg);
      }
      .lede {
        color: var(--muted);
        margin: 0 0 18px;
        max-width: 62ch;
      }
      .warn {
        border-left: 3px solid var(--accent);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        padding: 10px 13px;
        color: var(--muted);
        margin-bottom: 18px;
        background: var(--accent-soft);
        max-width: 78ch;
      }
      /* 内置列表版本：说明性文字，比正文更弱，读得到但不抢视线 */
      .listdata {
        color: var(--muted);
        font-size: 12px;
        margin: 0 0 14px;
        font-variant-numeric: tabular-nums;
      }
      .listdata:empty {
        display: none;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .bar .count {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      section {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow);
        margin-bottom: 12px;
        overflow: hidden;
      }
      section > header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 13px;
        border-bottom: 1px solid var(--line);
        background: var(--bg-soft);
      }
      section > header strong {
        font-size: 13.5px;
        word-break: break-all;
      }
      section > header button {
        margin-left: auto;
        padding: 4px 10px;
        font-size: 12.5px;
      }
      .count {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .section-hint {
        padding: 7px 13px 0;
        margin: 0;
      }
      .empty {
        padding: 34px 6px;
        color: var(--muted);
        text-align: center;
      }
      /* 批量操作：选中态与行复选框。复选框放在行首，删除按钮仍在行尾，避免误点。 */
      .bar.bulk {
        position: sticky;
        top: 0;
        z-index: 2;
        margin-bottom: 12px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .bar.bulk[hidden] {
        display: none;
      }
      input.pick,
      input.site-pick {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }
      section > header input.site-pick {
        margin-right: 2px;
      }
      li:has(input.pick:checked) {
        background: var(--accent-soft);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="brand">
        <img src="icons/icon-128.png" alt="" aria-hidden="true" />
        <b data-i18n="appTitle"></b>
      </header>

      <h1 data-i18n="optionsTitle"></h1>
      <p class="lede" data-i18n="optionsLede"></p>

      <div class="warn" data-i18n="optionsWarn"></div>

      <!-- 内置过滤列表的版本信息：静态规则集是打包文件，MV3 无法远程替换，
           所以"这份规则是哪天的"必须显示出来，用户报问题时才有依据。
           内容由 options.js 填入（读 dist/list-info.json），没有该文件时留空。 -->
      <p class="listdata" id="listdata"></p>

      <div class="bar">
        <button id="export" data-i18n="optionsExport"></button>
        <button id="refresh" data-i18n="optionsRefresh"></button>
        <span class="count" id="summary"></span>
      </div>

      <!-- 批量操作条：只在有选中项时出现（hidden），避免长期占位。
           勾选行复选框或站点复选框都会让它出现；"删除所选"对整站全选的情况走一次批量写入。 -->
      <div class="bar bulk" id="bulkbar" hidden>
        <span class="count" id="bulkcount"></span>
        <button id="bulkdelete" class="danger" data-i18n="optionsDeleteSelected"></button>
        <button id="bulkclear" data-i18n="optionsClearPicked"></button>
      </div>

      <div id="sites"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
