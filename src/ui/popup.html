<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AdBlow</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: #e5e7eb;
        --muted: #6b7280;
        --accent: #0f766e;
        --danger: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --line: #2a2f36;
          --muted: #9aa4b2;
          --accent: #2dd4bf;
          --danger: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 304px;
        font: 13px/1.55 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 11px 13px;
        border-bottom: 1px solid var(--line);
      }
      header strong {
        font-size: 14px;
        letter-spacing: 0.2px;
      }
      header span {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
      }
      main {
        padding: 12px 13px;
      }
      #host {
        font-weight: 600;
        word-break: break-all;
      }
      #notice {
        color: var(--muted);
        padding: 10px 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 10px 0 12px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .hint {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: -4px;
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 10px 13px;
        border-top: 1px solid var(--line);
      }
      button {
        font: inherit;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button.danger:hover {
        border-color: var(--danger);
        color: var(--danger);
      }
      footer button:first-child {
        margin-right: auto;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header><strong>AdBlow</strong><span id="version"></span></header>

    <main>
      <div id="host">读取中…</div>
      <div id="notice" hidden></div>

      <div class="row" id="toggle-row" hidden>
        <input type="checkbox" id="enabled" />
        <label for="enabled">在本站启用过滤</label>
      </div>

      <dl id="stats" hidden>
        <dt>规则拦截</dt>
        <dd id="stat-rule">0</dd>
        <dt>行为检测</dt>
        <dd id="stat-heuristic">0</dd>
        <dt>已学习规则</dt>
        <dd id="stat-learned">0</dd>
      </dl>
      <div class="hint" id="stats-hint" hidden></div>
    </main>

    <footer>
      <button id="open-options">规则管理</button>
      <button id="clear-site" class="danger">清空本站学习</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
